<!-- templates/admin/includes/sidebar.html -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="d-flex align-items-center">
      <h4 class="text-white mb-0">Admin Panel</h4>
    </div>
    <hr class="sidebar-separator">
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'admin_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
      <i class="fas fa-tachometer-alt"></i>
      Dashboard
    </a>
    <a href="{% url 'admin_document_requests' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_document_requests' %}active{% endif %}">
      <i class="fas fa-file-alt"></i>
      Document Requests
    </a>
    <a href="{% url 'admin_manage_students' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_manage_students' %}active{% endif %}">
      <i class="fas fa-users"></i>
      Manage Students
    </a>
    <a href="{% url 'admin_settings' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_settings' %}active{% endif %}">
      <i class="fas fa-cogs"></i>
      Settings
    </a>
    <a href="#" class="nav-item logout" onclick="confirmLogout(event)">
      <i class="fas fa-sign-out-alt"></i>
      Logout
    </a>
  </nav>
</div>

<script>
function confirmLogout(event) {
  event.preventDefault();
  if (confirm('Are you sure you want to log out?')) {
    window.location.href = "{% url 'logout' %}";
  }
}
</script>
<!-- Sidebar styling comes from dashboard/static/css/dashboard.css to match student layout -->
